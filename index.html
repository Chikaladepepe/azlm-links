<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0c14">
  <title>AZLM · Links</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='21' fill='%23071018' stroke='%2367e8f9' stroke-width='4'/><path d='M32 22 L22.5 28.9 L26.1 40.1 L37.9 40.1 L41.5 28.9 Z' fill='%2367e8f9'/><path d='M32 22 V11 M22.5 28.9 L12 25.5 M26.1 40.1 L19.7 49 M37.9 40.1 L44.3 49 M41.5 28.9 L52 25.5' stroke='%2367e8f9' stroke-width='4' fill='none' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0c14;
      --card: rgba(255, 255, 255, 0.045);
      --card-hover: rgba(255, 255, 255, 0.07);
      --line: rgba(255, 255, 255, 0.09);
      --txt: #f2f3f7;
      --muted: rgba(242, 243, 247, 0.55);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--txt);
      min-height: 100svh;
      display: flex;
      padding: 48px 20px 40px;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient background glows */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(620px 420px at 12% 8%,  rgba(124, 58, 237, 0.17), transparent 62%),
        radial-gradient(720px 520px at 88% 92%, rgba(34, 211, 238, 0.11), transparent 62%),
        radial-gradient(500px 360px at 80% 6%,  rgba(226, 35, 26, 0.08),  transparent 60%);
      animation: drift 14s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from { transform: translateY(0)    scale(1); }
      to   { transform: translateY(-14px) scale(1.03); }
    }

    .wrap {
      width: 100%;
      max-width: 430px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Profile header */
    .profile { text-align: center; margin-bottom: 30px; }

    .avatar {
      width: 76px;
      height: 76px;
      margin: 0 auto 14px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 35%, #0e2233 0%, #0a1422 55%, #070b14 100%);
      border: 2px solid rgba(103, 232, 249, 0.25);
      box-shadow:
        0 0 26px -6px rgba(34, 211, 238, 0.55),
        inset 0 0 18px rgba(34, 211, 238, 0.10);
    }

    .avatar svg { width: 60px; height: 60px; display: block; }

    /* Hologram animations */
    .holo-ball  { animation: holoFloat 3.6s ease-in-out infinite; }
    .holo-ring  { transform-origin: 32px 55px; animation: holoPulse 3.6s ease-in-out infinite; }
    .holo-scan  { animation: scanShift 1.6s linear infinite; }
    .spark      { opacity: 0; }
    .spark1     { animation: sparkUp 2.8s linear infinite 0.4s; }
    .spark2     { animation: sparkUp 3.5s linear infinite 1.6s; }

    @keyframes holoFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-2.4px); }
    }

    @keyframes holoPulse {
      0%, 100% { transform: scaleX(1);    opacity: 1; }
      50%      { transform: scaleX(0.85); opacity: 0.6; }
    }

    @keyframes scanShift {
      from { transform: translateY(2.2px); }
      to   { transform: translateY(0); }
    }

    @keyframes sparkUp {
      0%   { transform: translateY(0);    opacity: 0; }
      12%  { opacity: 0.9; }
      65%  { opacity: 0.6; }
      100% { transform: translateY(-9px); opacity: 0; }
    }

    h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: 0.04em; }
    .tagline { margin-top: 6px; font-size: 0.9rem; color: var(--muted); }

    /* Link buttons */
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--txt);
      text-decoration: none;
      transition: transform 0.18s ease, border-color 0.18s ease,
                  box-shadow 0.18s ease, background 0.18s ease;
      animation: fadeUp 0.5s ease backwards;
    }

    .link-btn:nth-child(2) { animation-delay: 0.08s; }
    .link-btn:nth-child(3) { animation-delay: 0.16s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    .link-btn:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 14px 34px -12px var(--glow);
      background: var(--card-hover);
    }

    .link-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .num {
      flex: 0 0 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1.25rem;
      background: var(--badge);
      box-shadow: 0 0 20px -6px var(--glow);
    }

    .texts { display: flex; flex-direction: column; min-width: 0; }

    .label {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sub {
      margin-top: 3px;
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sub svg { width: 14px; height: 14px; color: var(--accent); flex: 0 0 auto; }
    .sub svg.fill { fill: var(--accent); }

    .arrow {
      margin-left: auto;
      flex: 0 0 auto;
      color: rgba(255, 255, 255, 0.4);
      transition: color 0.18s ease, transform 0.18s ease;
    }

    .link-btn:hover .arrow {
      color: var(--accent);
      transform: translate(2px, -2px);
    }

    .foot {
      margin-top: 24px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.06em;
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>

  <main class="wrap">
    <header class="profile">
      <div class="avatar" aria-hidden="true">
        <svg class="holo" viewBox="0 0 64 64">
          <defs>
            <radialGradient id="ballGrad" cx="0.35" cy="0.3" r="0.9">
              <stop offset="0"    stop-color="#9ff4ff" stop-opacity="0.32"/>
              <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.10"/>

            <filter id="holoGlow" x="-60%" y="-60%" width="220%" height="220%">

            </g>
            <g fill="none" stroke="#aef6ff" stroke-width="1.1" stroke-linejoin="round">
              <path d="M32 24.5 L26.8 28.3 L28.8 34.45 L35.2 34.45 L37.2 28.3 Z" fill="#7df0ff" fill-opacity="0.3"/>
              <path d="M32 24.5 V16"/>
              <path d="M26.8 28.3 L18.7 25.7"/>
              <path d="M28.8 34.45 L23.8 41.3"/>
              <path d="M35.2 34.45 L40.2 41.3"/>
              <path d="M37.2 28.3 L45.3 25.7"/>
              <circle cx="32" cy="30" r="9.25" stroke-dasharray="2.4 2.2" stroke-width="0.8" opacity="0.5"/>
            </g>
          </g>

          <!-- hologram sparks -->
          <circle class="spark spark1" cx="21.5" cy="27" r="0.9" fill="#aef6ff"/>
          <circle class="spark spark2" cx="44"   cy="35" r="0.7" fill="#aef6ff"/>
        </svg>
      </div>
      <h1>AZLM</h1>
      <p class="tagline">Azure Latch MODDED · all my links</p>
    </header>
