<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0c14">
  <title>AZLM · Links</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0c14;
      --card: rgba(255, 255, 255, 0.045);
      --card-hover: rgba(255, 255, 255, 0.07);
      --line: rgba(255, 255, 255, 0.09);
      --txt: #f2f3f7;
      --muted: rgba(242, 243, 247, 0.55);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--txt);
      min-height: 100svh;
      display: flex;
      padding: 48px 20px 40px;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient background glows */
    .bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        radial-gradient(620px 420px at 12% 8%,  rgba(124, 58, 237, 0.17), transparent 62%),
        radial-gradient(720px 520px at 88% 92%, rgba(34, 211, 238, 0.11), transparent 62%),
        radial-gradient(500px 360px at 80% 6%,  rgba(226, 35, 26, 0.08),  transparent 60%);
      animation: drift 14s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from { transform: translateY(0)    scale(1); }
      to   { transform: translateY(-14px) scale(1.03); }
    }

    .wrap {
      width: 100%;
      max-width: 430px;
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Profile header */
    .profile { text-align: center; margin-bottom: 30px; }

    .avatar {
      width: 76px;
      height: 76px;
      margin: 0 auto 14px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 2rem;
      background: linear-gradient(145deg, #161827, #0e0f1a);
      border: 2px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 0 26px -6px rgba(124, 58, 237, 0.55);
    }

    h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: 0.04em; }
    .tagline { margin-top: 6px; font-size: 0.9rem; color: var(--muted); }

    /* Link buttons */
    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border-radius: 18px;
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--txt);
      text-decoration: none;
      transition: transform 0.18s ease, border-color 0.18s ease,
                  box-shadow 0.18s ease, background 0.18s ease;
      animation: fadeUp 0.5s ease backwards;
    }

    .link-btn:nth-child(2) { animation-delay: 0.08s; }
    .link-btn:nth-child(3) { animation-delay: 0.16s; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }

    .link-btn:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 14px 34px -12px var(--glow);
      background: var(--card-hover);
    }

    .link-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .num {
      flex: 0 0 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1.25rem;
      background: var(--badge);
      box-shadow: 0 0 20px -6px var(--glow);
    }

    .texts { display: flex; flex-direction: column; min-width: 0; }

    .label {
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sub {
      margin-top: 3px;
      font-size: 0.78rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sub svg { width: 14px; height: 14px; color: var(--accent); flex: 0 0 auto; }
    .sub svg.fill { fill: var(--accent); }

    .arrow {
      margin-left: auto;
      flex: 0 0 auto;
      color: rgba(255, 255, 255, 0.4);
      transition: color 0.18s ease, transform 0.18s ease;
    }

    .link-btn:hover .arrow {
      color: var(--accent);
      transform: translate(2px, -2px);
    }

    .foot {
      margin-top: 24px;
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.35);
      letter-spacing: 0.06em;
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
